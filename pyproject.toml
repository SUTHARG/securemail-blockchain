[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securemailscope"
version = "0.1.0"
description = "SecureMailScope: Cryptographic Security Posture Assessment for Network Forensic Traffic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dpkt==1.9.8",
    "cryptography==48.0.0",
    "jsonschema==4.25.1",
    "pyyaml==6.0.2",
    "pynacl==1.5.0",
    "web3==8.0.0",
]

[project.optional-dependencies]
backend = [
    "fastapi==0.115.5",
    "uvicorn==0.32.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "httpx==0.27.2",
    "scikit-learn==1.7.2",
    "joblib==1.5.2",
    "numpy==2.2.6",
]
pdf = [
    "pydyf==0.12.1",
    "weasyprint==64.1",
]
dev = [
    "pytest==8.4.2",
    "hypothesis==6.124.7",
    "pytest-asyncio==1.2.0",
]

[tool.setuptools.packages.find]
where = ["engine"]
include = ["smscope*"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "backend/tests", "validator/tests"]
pythonpath = [".", "engine"]
