[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securemailscope"
version = "0.1.0"
description = "SecureMailScope: AI-Assisted Cryptographic Security Posture Assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest==8.4.2",
    "dpkt==1.9.8",
    "cryptography==48.0.0",
    "jsonschema==4.25.1",
    "hypothesis==6.124.7",
]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]
