name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[backend,dev,pdf]

      - name: Collect and run engine tests
        run: |
          python -m pytest engine/tests --collect-only -q
          python -m pytest engine/tests -v

      - name: Collect and run validator tests
        run: |
          python -m pytest validator/tests --collect-only -q
          python -m pytest validator/tests -v

      - name: Collect and run backend tests
        run: |
          python -m pytest backend/tests --collect-only -q
          python -m pytest backend/tests -v

  test-contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install contracts dependencies
        run: |
          cd contracts
          npm ci

      - name: Run Hardhat contract suite
        run: |
          cd contracts
          npm test
