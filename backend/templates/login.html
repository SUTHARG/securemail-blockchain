{% extends "layout.html" %}

{% block title %}SecureMailScope - Analyst Login{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="card" style="padding: 2rem; border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="logo-icon" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto 1rem;">🛡️</div>
      <h2>Analyst Authentication</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">
        Authenticate with your Analyst API Key to access cases, upload traffic captures, and execute analysis.
      </p>
    </div>

    {% if error %}
    <div style="background: rgba(248, 81, 73, 0.15); border: 1px solid var(--fail); color: #ff7b72; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.9rem;">
      {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
      <input type="hidden" name="next" value="{{ next_url or '/' }}"/>
      <div class="form-group">
        <label for="api_key">Analyst API Key</label>
        <input
          type="password"
          id="api_key"
          name="api_key"
          placeholder="Enter ANALYST_API_KEY"
          required
          autofocus
          style="width: 100%; padding: 0.75rem 1rem; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: monospace;"
        />
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-top: 0.5rem;">
        Sign In as Analyst
      </button>
    </form>
  </div>
</div>
{% endblock %}
