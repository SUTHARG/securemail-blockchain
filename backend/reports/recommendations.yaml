rules:
  R01:
    ruleId: "R01"
    title: "Cleartext credentials sent before encryption"
    severity: "Critical"
    component: "Postfix / Dovecot"
    parameters:
      - "smtpd_tls_auth_only"
      - "disable_plaintext_auth"
    configuration_fix: |
      # Postfix (main.cf):
      smtpd_tls_auth_only = yes
      
      # Dovecot (10-auth.conf):
      disable_plaintext_auth = yes
    documentation_urls:
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_auth_only"
      - "https://doc.dovecot.org/configuration_manual/authentication/"
    explanation: "Disallow SASL authentication over unencrypted connections. Credentials will only be accepted after TLS negotiation."

  R02:
    ruleId: "R02"
    title: "Mail session with no encryption and STARTTLS not offered"
    severity: "High"
    component: "Postfix"
    parameters:
      - "smtpd_tls_security_level"
      - "smtpd_tls_cert_file"
      - "smtpd_tls_key_file"
    configuration_fix: |
      # Postfix (main.cf):
      smtpd_tls_security_level = may
      smtpd_tls_cert_file = /etc/ssl/certs/mailserver.pem
      smtpd_tls_key_file = /etc/ssl/private/mailserver.key
    documentation_urls:
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_security_level"
      - "http://www.postfix.org/TLS_README.html"
    explanation: "Enable opportunistic or mandatory TLS on the SMTP service by offering STARTTLS in EHLO responses with configured certificate keys."

  R03:
    ruleId: "R03"
    title: "STARTTLS offered but never attempted"
    severity: "High"
    component: "Postfix / Submission"
    parameters:
      - "smtpd_tls_security_level"
      - "smtpd_enforce_tls"
    configuration_fix: |
      # Postfix submission port 587 (master.cf):
      submission inet n - y - - smtpd
        -o smtpd_tls_security_level=encrypt
        -o smtpd_sasl_auth_enable=yes
    documentation_urls:
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_security_level"
      - "http://www.postfix.org/TLS_README.html#client_tls"
    explanation: "Enforce mandatory encryption on submission endpoints so clients cannot fall back to cleartext transmission."

  R06:
    ruleId: "R06"
    title: "TLS 1.0 or 1.1 negotiated"
    severity: "High"
    component: "Postfix / Dovecot"
    parameters:
      - "smtpd_tls_mandatory_protocols"
      - "smtpd_tls_protocols"
      - "ssl_min_protocol"
    configuration_fix: |
      # Postfix (main.cf):
      smtpd_tls_protocols = >=TLSv1.2
      smtpd_tls_mandatory_protocols = >=TLSv1.2

      # Dovecot (10-ssl.conf):
      ssl_min_protocol = TLSv1.2
    documentation_urls:
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_protocols"
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_mandatory_protocols"
      - "https://doc.dovecot.org/configuration_manual/dovecot_ssl_configuration/"
    explanation: "Disable obsolete TLS 1.0 and 1.1 protocols per RFC 8996 and mandate at least TLS 1.2."

  R08:
    ruleId: "R08"
    title: "RC4, DES, or 3DES cipher suite"
    severity: "High"
    component: "Postfix / Dovecot"
    parameters:
      - "smtpd_tls_ciphers"
      - "smtpd_tls_exclude_ciphers"
      - "ssl_cipher_list"
    configuration_fix: |
      # Postfix (main.cf):
      smtpd_tls_ciphers = high
      smtpd_tls_exclude_ciphers = aNULL, eNULL, EXPORT, RC4, DES, 3DES, MD5, PSK

      # Dovecot (10-ssl.conf):
      ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    documentation_urls:
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_exclude_ciphers"
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_ciphers"
    explanation: "Exclude legacy and broken symmetric ciphers (RC4, DES, 3DES) susceptible to Sweet32 and statistical biases."

  R09:
    ruleId: "R09"
    title: "No forward secrecy (static RSA or static DH)"
    severity: "Medium"
    component: "Postfix"
    parameters:
      - "smtpd_tls_eecdh_grade"
      - "smtpd_tls_ciphers"
    configuration_fix: |
      # Postfix (main.cf):
      smtpd_tls_eecdh_grade = strong
      smtpd_tls_ciphers = high
      smtpd_tls_exclude_ciphers = kRSA, aNULL, eNULL, EXPORT, RC4, DES, 3DES, MD5
    documentation_urls:
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_eecdh_grade"
      - "http://www.postfix.org/TLS_README.html"
    explanation: "Mandate ephemeral key exchange (ECDHE or DHE) to ensure past traffic remains protected against future private key compromise."

  R11:
    ruleId: "R11"
    title: "Certificate expired at capture time"
    severity: "High"
    component: "Postfix / Dovecot / ACME"
    parameters:
      - "smtpd_tls_cert_file"
      - "smtpd_tls_key_file"
    configuration_fix: |
      # Renew certificates via Certbot / ACME client:
      certbot renew --post-hook "postfix reload && dovecot reload"
      
      # Ensure Postfix references active valid certificates:
      smtpd_tls_cert_file = /etc/letsencrypt/live/mail.example.com/fullchain.pem
      smtpd_tls_key_file = /etc/letsencrypt/live/mail.example.com/privkey.pem
    documentation_urls:
      - "http://www.postfix.org/TLS_README.html#server_cert_key"
      - "https://certbot.eff.org/docs/using.html"
    explanation: "Renew expired X.509 certificate and verify automatic certificate renewal pipelines and daemon reload hooks."

  R12:
    ruleId: "R12"
    title: "RSA key below 2048 bits or EC key below 224 bits"
    severity: "High"
    component: "OpenSSL / Postfix"
    parameters:
      - "smtpd_tls_cert_file"
      - "smtpd_tls_key_file"
    configuration_fix: |
      # Generate modern RSA 2048/4096 or ECDSA P-256 certificate:
      openssl req -newkey rsa:2048 -nodes -keyout /etc/ssl/private/mail.key -x509 -days 365 -out /etc/ssl/certs/mail.pem
      
      # Postfix (main.cf):
      smtpd_tls_key_file = /etc/ssl/private/mail.key
      smtpd_tls_cert_file = /etc/ssl/certs/mail.pem
    documentation_urls:
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_key_file"
      - "https://www.openssl.org/docs/man1.1.1/man1/genrsa.html"
    explanation: "Replace cryptographically weak keys with RSA keys >= 2048 bits or EC keys >= 256 bits."

  R13:
    ruleId: "R13"
    title: "MD5 or SHA-1 signature on a non-root certificate in the chain"
    severity: "High"
    component: "OpenSSL / CA"
    parameters:
      - "default_md"
    configuration_fix: |
      # In openssl.cnf, set secure digest algorithm:
      default_md = sha256
      
      # Re-sign certificates using SHA-256 or SHA-384:
      openssl ca -md sha256 -in csr.pem -out cert.pem
    documentation_urls:
      - "https://www.openssl.org/docs/man1.1.1/man1/req.html"
      - "http://www.postfix.org/TLS_README.html"
    explanation: "Re-issue certificate hierarchy using SHA-256 or SHA-384 signature algorithms; discard vulnerable SHA-1 and MD5 intermediate certificates."

  R15:
    ruleId: "R15"
    title: "Unknown issuer or incomplete chain"
    severity: "Low"
    component: "Postfix"
    parameters:
      - "smtpd_tls_chain_files"
      - "smtpd_tls_CAfile"
    configuration_fix: |
      # Postfix 3.4+ (main.cf):
      smtpd_tls_chain_files = /etc/ssl/certs/fullchain.pem
      
      # Earlier Postfix versions:
      smtpd_tls_CAfile = /etc/ssl/certs/ca-bundle.crt
    documentation_urls:
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_chain_files"
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_CAfile"
    explanation: "Bundle the intermediate CA certificates with the leaf server certificate so connecting mail agents can establish chain of trust."

  R16:
    ruleId: "R16"
    title: "Self-signed leaf certificate"
    severity: "Medium"
    component: "Postfix / Let's Encrypt"
    parameters:
      - "smtpd_tls_cert_file"
      - "smtpd_tls_key_file"
    configuration_fix: |
      # Replace self-signed certificate with one issued by a trusted public CA (e.g. Let's Encrypt):
      certbot certonly --standalone -d mail.example.com
      
      # Postfix (main.cf):
      smtpd_tls_cert_file = /etc/letsencrypt/live/mail.example.com/fullchain.pem
      smtpd_tls_key_file = /etc/letsencrypt/live/mail.example.com/privkey.pem
    documentation_urls:
      - "http://www.postfix.org/TLS_README.html#server_cert_key"
      - "https://certbot.eff.org/"
    explanation: "Obtain and deploy an X.509 certificate signed by a recognized Certificate Authority to prevent trust warnings and connection aborts."

  R19:
    ruleId: "R19"
    title: "Certificate not observable (TLS 1.3 or resumed)"
    severity: "Info"
    component: "Network Monitoring / TLS 1.3"
    parameters:
      - "rfc8446"
    configuration_fix: |
      # RFC 8446 standard behavior:
      # In TLS 1.3, Server Certificate and CertificateVerify messages are fully encrypted.
      # Resumed sessions using session tickets bypass certificate transmission.
      # Passive network capture cannot observe X.509 certificates without endpoints sharing keys.
      # Ensure server configuration enforces valid TLS 1.3 parameters.
    documentation_urls:
      - "https://datatracker.ietf.org/doc/html/rfc8446"
      - "http://www.postfix.org/TLS_README.html#server_tls"
    explanation: "Informational note: TLS 1.3 encrypts handshake certificates and resumed sessions omit them by protocol specification. No remediation is required."

  R04:
    ruleId: "R04"
    title: "STARTTLS attempted, refused, session continued in plaintext"
    severity: "High"
    component: "Postfix / Submission"
    parameters:
      - "smtpd_tls_security_level"
      - "smtp_tls_security_level"
    configuration_fix: |
      # Postfix client (main.cf):
      smtp_tls_security_level = dane
      # Postfix server (main.cf):
      smtpd_tls_security_level = encrypt
    documentation_urls:
      - "http://www.postfix.org/postconf.5.html#smtp_tls_security_level"
      - "http://www.postfix.org/TLS_README.html#client_tls_limits"
    explanation: "Prevent downgrade and stripping attacks by enforcing mandatory TLS on transmission when STARTTLS is attempted or required, rather than falling back to plaintext."

  R05:
    ruleId: "R05"
    title: "SSL 3.0 or older negotiated"
    severity: "Critical"
    component: "Postfix / Dovecot"
    parameters:
      - "smtpd_tls_mandatory_protocols"
      - "smtpd_tls_protocols"
      - "ssl_min_protocol"
    configuration_fix: |
      # Postfix (main.cf):
      smtpd_tls_protocols = !SSLv2, !SSLv3, !TLSv1, !TLSv1.1, >=TLSv1.2
      smtpd_tls_mandatory_protocols = !SSLv2, !SSLv3, !TLSv1, !TLSv1.1, >=TLSv1.2

      # Dovecot (10-ssl.conf):
      ssl_min_protocol = TLSv1.2
    documentation_urls:
      - "https://datatracker.ietf.org/doc/html/rfc7568"
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_protocols"
    explanation: "Prohibit SSL 3.0 and older protocols completely per RFC 7568 due to fundamental vulnerabilities like POODLE."

  R07:
    ruleId: "R07"
    title: "NULL, EXPORT, or anonymous cipher suite"
    severity: "Critical"
    component: "Postfix / Dovecot"
    parameters:
      - "smtpd_tls_exclude_ciphers"
      - "ssl_cipher_list"
    configuration_fix: |
      # Postfix (main.cf):
      smtpd_tls_exclude_ciphers = aNULL, eNULL, EXPORT, anon
      smtpd_tls_ciphers = high

      # Dovecot (10-ssl.conf):
      ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    documentation_urls:
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_exclude_ciphers"
      - "https://doc.dovecot.org/configuration_manual/dovecot_ssl_configuration/"
    explanation: "Disable NULL (unencrypted), EXPORT (artificially weakened), and anonymous ciphers that provide no confidentiality or no authentication."

  R10:
    ruleId: "R10"
    title: "DHE prime below 2048 bits"
    severity: "Medium"
    component: "Postfix / Dovecot"
    parameters:
      - "smtpd_tls_dh1024_param_file"
      - "ssl_dh"
    configuration_fix: |
      # Generate a strong 2048-bit or 4096-bit DH parameter file:
      openssl dhparam -out /etc/ssl/certs/dh2048.pem 2048

      # Postfix (main.cf):
      smtpd_tls_dh1024_param_file = /etc/ssl/certs/dh2048.pem

      # Dovecot (10-ssl.conf):
      ssl_dh = </etc/ssl/certs/dh2048.pem
    documentation_urls:
      - "http://www.postfix.org/postconf.5.html#smtpd_tls_dh1024_param_file"
      - "https://weakdh.org/sysadmin.html"
    explanation: "Replace Diffie-Hellman primes smaller than 2048 bits with 2048-bit or larger parameters to prevent precomputation and Logjam attacks."

  R14:
    ruleId: "R14"
    title: "Certificate name does not match SNI"
    severity: "Medium"
    component: "Postfix / TLS SNI"
    parameters:
      - "tls_server_sni_maps"
      - "smtpd_tls_cert_file"
    configuration_fix: |
      # Postfix SNI mapping (main.cf):
      tls_server_sni_maps = hash:/etc/postfix/sni_maps

      # /etc/postfix/sni_maps:
      # mail.example.com /etc/ssl/certs/mail_example_com.pem /etc/ssl/private/mail_example_com.key
    documentation_urls:
      - "http://www.postfix.org/postconf.5.html#tls_server_sni_maps"
      - "https://datatracker.ietf.org/doc/html/rfc6125"
    explanation: "Ensure the Subject Alternative Name (SAN) of the certificate contains the domain requested by the client SNI, or configure SNI maps for multi-tenant deployments."

  R17:
    ruleId: "R17"
    title: "STARTTLS advertised to one server in some sessions and not in others"
    severity: "Medium"
    component: "Network / Upstream Proxy / Mail Gateway"
    parameters:
      - "smtpd_tls_security_level"
      - "smtp_tls_policy_maps"
    configuration_fix: |
      # Investigate network path for active tampering or load-balancer inconsistencies.
      # Enforce mandatory TLS on client / sending MTA:
      smtp_tls_policy_maps = hash:/etc/postfix/tls_policy
      # In /etc/postfix/tls_policy:
      # example.com secure match=example.com
    documentation_urls:
      - "http://www.postfix.org/TLS_README.html#client_tls_policy"
      - "https://datatracker.ietf.org/doc/html/rfc7435"
    explanation: "Inconsistent STARTTLS capability across sessions may indicate an active adversary stripping STARTTLS or an inconsistent proxy/MTA configuration."

  R18:
    ruleId: "R18"
    title: "Different leaf certificate for the same server endpoint within the capture"
    severity: "Medium"
    component: "TLS Certificates / Load Balancer"
    parameters:
      - "smtpd_tls_chain_files"
    configuration_fix: |
      # Synchronize certificates across all backend servers or load balancer nodes.
      # Ensure automated certificate rotation does not deploy conflicting certificates simultaneously.
    documentation_urls:
      - "http://www.postfix.org/TLS_README.html#server_cert_key"
    explanation: "Multiple leaf certificate fingerprints observed for the same server endpoint indicates inconsistent certificate provisioning across backend cluster nodes or dynamic MITM interception."
